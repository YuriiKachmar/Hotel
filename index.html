<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Готель — Контроль робіт</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#111214;--surf:#18191d;--surf2:#1f2025;--brd:#2c2d33;
  --txt:#e2e4ea;--mut:#5a5c6a;--acc:#e8b84b;
  --mmg:#6b7280;--std:#1e293b;--biz:#854d0e;--imp:#14532d;--semi:#581c87;--lux:#7f1d1d;
  --mmg-t:#fff;--std-t:#94a3b8;--biz-t:#fde68a;--imp-t:#86efac;--semi-t:#d8b4fe;--lux-t:#fca5a5;
  --sn:#2c2d33;--sw:#2563eb;--sd:#16a34a;--si:#dc2626;
  --cn:#5a5c6a;--cw:#3b82f6;--cd:#22c55e;--ci:#ef4444;
  --wn-bg:#1f2025;--ww-bg:#0c2340;--wd-bg:#052e16;--wi-bg:#2d0a0a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;gap:7px;padding:9px 15px;background:var(–surf);border-bottom:1px solid var(–brd);flex-shrink:0;flex-wrap:wrap}
.logo{font-family:‘Oswald’,sans-serif;font-size:19px;letter-spacing:3px;color:var(–acc);white-space:nowrap}
.logo em{font-style:normal;color:var(–mut);font-size:11px;letter-spacing:0;margin-left:8px;font-family:‘IBM Plex Sans’,sans-serif}
.ml{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-family:‘IBM Plex Sans’,sans-serif;font-size:12px;font-weight:500;padding:5px 11px;border-radius:5px;border:1px solid var(–brd);background:var(–surf2);color:var(–txt);cursor:pointer;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(–acc);color:var(–acc)}
.btn.pri{background:var(–acc);color:#111;border-color:var(–acc);font-weight:600}
.btn.pri:hover{background:#f5d060}
.btn.sm{font-size:10px;padding:3px 8px;color:var(–mut)}
.btn.sm:hover{color:var(–acc);border-color:var(–acc)}
.srch{font-family:‘IBM Plex Mono’,monospace;font-size:12px;background:var(–surf2);border:1px solid var(–brd);color:var(–txt);padding:5px 9px;border-radius:5px;outline:none;width:95px}
.srch:focus{border-color:var(–acc)}
.srch::placeholder{color:var(–mut)}

.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:205px;background:var(–surf);border-right:1px solid var(–brd);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;padding:13px 17px}

.sb-s{padding:10px 11px 3px}
.sb-l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(–mut);font-weight:600;margin-bottom:5px}
.fb{display:flex;align-items:center;justify-content:space-between;width:100%;padding:5px 7px;border-radius:4px;background:none;border:none;color:var(–txt);font-family:‘IBM Plex Sans’,sans-serif;font-size:12px;cursor:pointer;transition:.1s;margin-bottom:1px;text-align:left}
.fb:hover{background:var(–surf2)}
.fb.act{background:var(–surf2);color:var(–acc);font-weight:500}
.fbg{font-family:‘IBM Plex Mono’,monospace;font-size:10px;color:var(–mut);background:var(–bg);padding:1px 4px;border-radius:3px}
.fb.act .fbg{color:var(–acc)}
.leg{padding:10px 11px;margin-top:auto;border-top:1px solid var(–brd)}
.lr{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:var(–mut)}
.lsw{width:22px;height:10px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,.1)}

.stats{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:var(–surf);border:1px solid var(–brd);border-radius:6px;padding:8px 11px;flex:1;min-width:76px}
.sn{font-family:‘Oswald’,sans-serif;font-size:22px;line-height:1;margin-bottom:1px}
.sl{font-size:10px;color:var(–mut);text-transform:uppercase;letter-spacing:.4px}
.pw{flex:2;min-width:140px}
.pb{background:var(–brd);border-radius:2px;height:4px;overflow:hidden;margin-top:5px}
.pf{height:100%;border-radius:2px;background:var(–acc);transition:width .5s}

.fb2{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;border-radius:4px;background:none;border:none;color:var(–mut);font-family:‘IBM Plex Sans’,sans-serif;font-size:11px;cursor:pointer;transition:.1s;margin-bottom:1px;text-align:left}
.fb2:hover,.fb2.act{background:var(–surf2);color:var(–txt)}
.dot8{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.floor-block{margin-bottom:22px}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-family:‘Oswald’,sans-serif;font-size:13px;letter-spacing:2px;color:var(–mut)}
.fh::after{content:’’;flex:1;height:1px;background:var(–brd)}
.fi{font-size:11px;font-family:‘IBM Plex Sans’,sans-serif;font-weight:300;letter-spacing:0}
.sec{margin-bottom:7px}
.secl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(–mut);opacity:.55;margin-bottom:4px;padding-left:1px}
.rg{display:flex;flex-wrap:wrap;gap:4px}

.room{width:62px;height:54px;border-radius:5px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s,box-shadow .1s;position:relative;user-select:none;flex-shrink:0}
.room:hover{transform:scale(1.1);z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.room.named{width:88px}
.room.hidden{display:none}
.rnum{font-family:‘IBM Plex Mono’,monospace;font-size:12px;font-weight:600;line-height:1.15;text-align:center;padding:0 2px}
.rtyp{font-size:8px;letter-spacing:.2px;text-transform:uppercase;opacity:.65;margin-top:1px}
.rpb{position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 4px 4px;background:rgba(255,255,255,.07)}
.rpbf{height:100%;border-radius:0 0 4px 4px;background:#22c55e;transition:width .3s}
.t-mmg{background:var(–mmg);color:var(–mmg-t)}
.t-std{background:var(–std);color:var(–std-t)}
.t-biz{background:var(–biz);color:var(–biz-t)}
.t-imp{background:var(–imp);color:var(–imp-t)}
.t-semi{background:var(–semi);color:var(–semi-t)}
.t-lux{background:var(–lux);color:var(–lux-t)}
.room[data-s=“n”]{border-color:var(–sn)}
.room[data-s=“w”]{border-color:var(–sw)}
.room[data-s=“d”]{border-color:var(–sd)}
.room[data-s=“i”]{border-color:var(–si);box-shadow:0 0 6px #dc262644}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:100;padding:13px;opacity:0;pointer-events:none;transition:opacity .17s}
.ov.open{opacity:1;pointer-events:auto}
.modal{background:var(–surf);border:1px solid var(–brd);border-radius:9px;width:100%;max-width:520px;position:relative;transform:translateY(14px);transition:transform .17s;max-height:91vh;display:flex;flex-direction:column;overflow:hidden}
.ov.open .modal{transform:translateY(0)}
.mhd{padding:13px 17px 11px;border-bottom:1px solid var(–brd);flex-shrink:0}
.mbd{overflow-y:auto;padding:11px 17px;flex:1}
.mft{padding:9px 17px;border-top:1px solid var(–brd);flex-shrink:0;display:flex;gap:6px}
.mtit{font-family:‘Oswald’,sans-serif;font-size:21px;letter-spacing:2px}
.mmeta{font-size:11px;color:var(–mut);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mbadge{padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600}
.mpb{background:var(–brd);border-radius:2px;height:3px;overflow:hidden;margin-top:7px}
.mpf{height:100%;border-radius:2px;background:#22c55e;transition:width .3s}
.x{position:absolute;top:11px;right:11px;background:none;border:none;color:var(–mut);font-size:17px;cursor:pointer;line-height:1}
.x:hover{color:var(–txt)}
.fg{margin-bottom:12px}
.fl{font-size:10px;color:var(–mut);font-weight:600;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}

.wr{border:1px solid var(–brd);border-radius:6px;margin-bottom:4px;overflow:hidden}
.wr.sw{border-color:var(–sw)}
.wr.sd{border-color:var(–sd)}
.wr.si{border-color:var(–si)}
.wrt{display:flex;align-items:center;gap:5px;padding:7px 9px;background:var(–surf2)}
.wrn{flex:1;font-size:13px;font-weight:500}
.wrbtns{display:flex;gap:2px;flex-shrink:0;flex-wrap:wrap}
.stb{padding:4px 7px;border-radius:4px;border:1px solid var(–brd);background:none;font-size:10px;font-weight:600;cursor:pointer;font-family:‘IBM Plex Sans’,sans-serif;color:var(–mut);transition:.1s}
.stb:hover{border-color:var(–txt);color:var(–txt)}
.stb.ow{background:var(–ww-bg);border-color:var(–sw);color:#60a5fa}
.stb.od{background:var(–wd-bg);border-color:var(–sd);color:#4ade80}
.stb.oi{background:var(–wi-bg);border-color:var(–si);color:#f87171}
.wdel{background:none;border:none;color:var(–mut);cursor:pointer;font-size:13px;padding:0 2px;opacity:.3;flex-shrink:0}
.wdel:hover{opacity:1;color:#ef4444}
.wcon{display:flex;align-items:center;gap:6px;padding:3px 9px 6px;background:var(–surf2)}
.wconl{font-size:10px;color:var(–mut);font-weight:600;text-transform:uppercase;white-space:nowrap}
.wcon select{flex:1;padding:4px 5px;font-size:12px;background:var(–bg);border:1px solid var(–brd);color:var(–txt);border-radius:4px;font-family:‘IBM Plex Sans’,sans-serif;outline:none}
.wcon select:focus{border-color:var(–acc)}

.wiss{background:var(–surf2);border-top:1px solid #3d1010}
.wiss-hd{display:flex;align-items:center;justify-content:space-between;padding:5px 9px}
.wiss-lbl{font-size:10px;color:#f87171;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.wiss-bd{padding:0 9px 8px}
.ient{border-left:2px solid #7f2222;padding:3px 0 3px 8px;margin-bottom:5px}
.idate{font-size:10px;color:var(–mut);margin-bottom:2px;display:flex;gap:5px;align-items:center}
.itxt{font-size:12px;color:var(–txt)}
.ist-o{font-size:9px;padding:1px 5px;border-radius:2px;background:var(–wi-bg);color:#f87171;font-weight:600}
.ist-c{font-size:9px;padding:1px 5px;border-radius:2px;background:var(–wd-bg);color:#4ade80;font-weight:600}
.iadd{padding:5px 0}
.iadd textarea{width:100%;background:var(–bg);border:1px solid #522;color:#fca5a5;border-radius:4px;padding:6px 8px;font-family:‘IBM Plex Sans’,sans-serif;font-size:12px;outline:none;resize:vertical;min-height:50px}
.iadd textarea::placeholder{color:#7f4040}
.iadd-row{display:flex;gap:5px;margin-top:4px}

.aw{display:flex;gap:4px;margin-top:5px}
.aw input{flex:1;background:var(–bg);border:1px dashed var(–brd);color:var(–txt);border-radius:4px;padding:6px 8px;font-family:‘IBM Plex Sans’,sans-serif;font-size:12px;outline:none}
.aw input:focus{border-color:var(–acc)}
.aw input::placeholder{color:var(–mut)}
.aw .ab{background:none;border:1px solid var(–brd);color:var(–mut);border-radius:4px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:‘IBM Plex Sans’,sans-serif;transition:.1s;white-space:nowrap}
.aw .ab:hover{border-color:var(–acc);color:var(–acc)}

textarea.rnotes{width:100%;background:var(–bg);border:1px solid var(–brd);color:var(–txt);border-radius:4px;padding:6px 8px;font-family:‘IBM Plex Sans’,sans-serif;font-size:12px;outline:none;resize:vertical;min-height:50px}
textarea.rnotes:focus{border-color:var(–acc)}
.hist{max-height:75px;overflow-y:auto}
.hi{border-left:2px solid var(–brd);padding:2px 0 2px 7px;margin-bottom:3px;font-size:11px;color:var(–mut)}
.hi strong{color:var(–txt)}

.pm{background:var(–surf);border:1px solid var(–brd);border-radius:9px;width:100%;max-width:660px;padding:16px;position:relative;transform:translateY(14px);transition:transform .17s;max-height:91vh;overflow-y:auto}
.ov.open .pm{transform:translateY(0)}
.ptit{font-family:‘Oswald’,sans-serif;font-size:17px;letter-spacing:2px;margin-bottom:12px;color:var(–acc)}
.psec{background:var(–surf2);border:1px solid var(–brd);border-radius:5px;padding:9px 11px;margin-bottom:7px}
.psecl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(–mut);margin-bottom:6px}
.prg{display:flex;flex-wrap:wrap;gap:4px}
.pr{border-radius:4px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;transition:transform .1s;width:56px;height:50px}
.pr.pn{width:80px}
.pr:hover{transform:scale(1.08);z-index:3}
.prn{font-family:‘IBM Plex Mono’,monospace;font-size:11px;font-weight:600;text-align:center;padding:0 2px;line-height:1.2}
.prt{font-size:7px;text-transform:uppercase;opacity:.65;margin-top:1px}
.prdot{position:absolute;bottom:3px;right:3px;width:5px;height:5px;border-radius:50%}
.prbar{position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:0 0 3px 3px}
.pleg{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid var(–brd)}
.pli{display:flex;align-items:center;gap:4px;font-size:10px;color:var(–mut)}
.plsw{width:12px;height:12px;border-radius:2px;flex-shrink:0}

.ci{display:flex;flex-direction:column;gap:4px;padding:8px 9px;background:var(–surf2);border:1px solid var(–brd);border-radius:5px;margin-bottom:4px}
.cir{display:flex;align-items:center;gap:6px}
.ci input{flex:1;background:var(–bg);border:1px solid var(–brd);color:var(–txt);border-radius:4px;padding:4px 7px;font-family:‘IBM Plex Sans’,sans-serif;font-size:12px;outline:none}
.ci input.em{font-size:11px;color:var(–mut)}
.ci input:focus{border-color:var(–acc)}
.cdel{background:none;border:none;color:var(–mut);cursor:pointer;font-size:13px;padding:0 2px;opacity:.3;flex-shrink:0}
.cdel:hover{opacity:1;color:#ef4444}

.csb{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 11px;border-radius:5px;background:var(–surf2);border:1px solid var(–brd);color:var(–txt);font-family:‘IBM Plex Sans’,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:.12s;margin-bottom:4px;text-align:left}
.csb:hover{border-color:var(–acc);color:var(–acc)}
.cbg{font-family:‘IBM Plex Mono’,monospace;font-size:10px;background:var(–bg);padding:2px 5px;border-radius:3px;color:var(–mut)}

.cp-ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:200;padding:13px;opacity:0;pointer-events:none;transition:opacity .17s}
.cp-ov.open{opacity:1;pointer-events:auto}
.cp{background:var(–surf);border:1px solid var(–brd);border-radius:9px;width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column;position:relative;transform:translateY(14px);transition:transform .17s;overflow:hidden}
.cp-ov.open .cp{transform:translateY(0)}
.cphd{padding:13px 17px 9px;border-bottom:1px solid var(–brd);flex-shrink:0}
.cptit{font-family:‘Oswald’,sans-serif;font-size:17px;letter-spacing:2px;color:var(–acc)}
.cpsub{font-size:11px;color:var(–mut);margin-top:3px}
.cpbd{overflow-y:auto;padding:10px 14px;flex:1}
.cpfl{font-family:‘Oswald’,sans-serif;font-size:11px;letter-spacing:1.5px;color:var(–mut);padding:5px 0 6px;border-bottom:1px solid var(–brd);margin-bottom:8px}
.cpsl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(–mut);opacity:.55;margin-bottom:3px;margin-top:7px}
.cpr{background:var(–surf2);border:1px solid var(–brd);border-radius:5px;margin-bottom:4px;overflow:hidden}
.cprhd{display:flex;align-items:center;gap:7px;padding:7px 9px}
.cprnum{font-family:‘IBM Plex Mono’,monospace;font-size:13px;font-weight:600;color:var(–acc);min-width:40px}
.cprt{font-size:10px;color:var(–mut);text-transform:uppercase;flex:1}
.cprpct{font-family:‘IBM Plex Mono’,monospace;font-size:11px;color:var(–mut)}
.cpw{padding:2px 9px 7px}
.cpwr{display:flex;align-items:center;gap:7px;padding:3px 0;border-bottom:1px solid var(–brd)}
.cpwr:last-child{border:none}
.cpwn{flex:1;font-size:12px}
.cpwst{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;white-space:nowrap}
.ws-n{background:var(–surf);color:var(–mut)}
.ws-w{background:var(–ww-bg);color:#60a5fa}
.ws-d{background:var(–wd-bg);color:#4ade80}
.ws-i{background:var(–wi-bg);color:#f87171}
.cpwnote{font-size:10px;color:#f87171;font-style:italic;padding:1px 0 3px}

.rep-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;z-index:100;opacity:0;pointer-events:none;transition:opacity .17s}
.rep-ov.open{opacity:1;pointer-events:auto}
.rep-p{background:var(–surf);border-top:1px solid var(–brd);width:100%;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s}
.rep-ov.open .rep-p{transform:translateY(0)}
.rephd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(–brd);flex-shrink:0;flex-wrap:wrap;gap:8px}
.reptit{font-family:‘Oswald’,sans-serif;font-size:18px;letter-spacing:2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font-family:‘IBM Plex Sans’,sans-serif;font-size:11px;font-weight:500;padding:5px 10px;border-radius:4px;border:1px solid var(–brd);background:none;color:var(–mut);cursor:pointer;transition:.12s}
.tab:hover{border-color:var(–acc);color:var(–acc)}
.tab.act{background:var(–acc);color:#111;border-color:var(–acc);font-weight:600}
.rep-body{overflow-y:auto;padding:14px 18px;flex:1}

.rep-sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rc{background:var(–surf2);border:1px solid var(–brd);border-radius:6px;padding:11px}
.rc h4{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(–mut);margin-bottom:7px}
.rr{display:flex;justify-content:space-between;font-size:12px;color:var(–mut);padding:3px 0;border-bottom:1px solid var(–brd)}
.rr:last-child{border:none}
.rr strong{color:var(–txt)}

.rep-2col{display:flex;gap:0;height:100%;min-height:380px}
.rep-list{width:210px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(–brd);padding-right:12px}
.rep-detail{flex:1;overflow-y:auto;padding-left:16px}
.rep-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 10px;border-radius:5px;border:1px solid var(–brd);background:var(–surf2);color:var(–txt);font-family:‘IBM Plex Sans’,sans-serif;font-size:12px;font-weight:500;cursor:pointer;margin-bottom:4px;text-align:left;transition:.12s;gap:6px}
.rep-item:hover{border-color:var(–acc)}
.rep-item.act{border-color:var(–acc);color:var(–acc)}
.rep-item-r{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ri-badge{font-family:‘IBM Plex Mono’,monospace;font-size:10px;background:var(–bg);padding:2px 5px;border-radius:3px;color:var(–mut)}
.ri-iss{font-size:10px;color:#f87171;font-weight:600}
.det-title{font-family:‘Oswald’,sans-serif;font-size:15px;letter-spacing:2px;color:var(–acc);margin-bottom:10px}
.det-stats{font-size:12px;color:var(–mut);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.det-legend{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.det-leg-i{display:flex;align-items:center;gap:4px;font-size:11px;color:var(–mut)}
.det-floor{margin-bottom:12px}
.det-fl-title{font-family:‘Oswald’,sans-serif;font-size:11px;letter-spacing:1.5px;color:var(–mut);padding:4px 0 5px;border-bottom:1px solid var(–brd);margin-bottom:7px}
.det-sec-title{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(–mut);opacity:.55;margin-bottom:4px;margin-top:6px}
.det-rooms{display:flex;flex-wrap:wrap;gap:5px}

const WSLBL= {n:'Не розпочато',w:'В роботі',d:'Виконано ✓',i:'Проблема ⚠'};

const DEFAULT_WORKS = ['Шпаклівка стін','Фарбування стін і стель','Шпалери','Ковролін'];

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const allRooms  = () => FLOORS.flatMap(f => f.sections.flatMap(s => s.rooms));
const mkWork    = n  => ({name:n, ws:'n', con:'', issues:[]});
const mkIssue   = t  => ({id:Date.now()+Math.random(), date:new Date().toLocaleString('uk',{dateStyle:'short',timeStyle:'short'}), text:t, status:'open'});
const cName     = c  => typeof c==='string' ? c : (c.name||'');
const cEmail    = c  => typeof c==='string' ? '' : (c.email||'');
const rl        = n  => ROOM_NAMES[n] || String(n);
const rtp       = n  => TM[RT[n]||'std'];
const pct       = ws => !ws||!ws.length ? 0 : Math.round(ws.filter(w=>w.ws==='d').length/ws.length*100);
const tp        = (d,t) => t ? Math.round(d/t*100) : 0;
const nowStr    = () => new Date().toLocaleString('uk',{dateStyle:'short',timeStyle:'short'});
const toN       = r  => isNaN(r) ? r : Number(r);

function autoS(works) {
  if(!works||!works.length) return 'n';
  const ws = works.map(w=>w.ws);
  if(ws.some(s=>s==='i')) return 'i';
  if(ws.every(s=>s==='d')) return 'd';
  if(ws.every(s=>s==='n')) return 'n';
  return 'w';
}

// ═══════════════════════════════════════════════════════════
const firebaseConfig = {

  databaseURL: "https://zamarstynivska-25-default-rtdb.europe-west1.firebasedatabase.app",

  storageBucket: "zamarstynivska-25.firebasestorage.app",

  appId: "1:1066701061895:web:b0a87dd095308e1c244fa2"
};

// Firebase буде завантажено з CDN
let db, auth, fbReady = false;

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let rooms = (() => {
  try { const r=localStorage.getItem('ht_rooms'); if(r) return JSON.parse(r); } catch(e){}
  const d={}; allRooms().forEach(n=>{ d[n]={s:'n',works:DEFAULT_WORKS.map(mkWork),notes:'',hist:[]}; }); return d;
})();

let CONS = (() => {
  try {
    const c=localStorage.getItem('ht_cons');
    if(c) return JSON.parse(c).map(c=>typeof c==='string'&&c!=='—'?{name:c,email:''}:c);
  } catch(e){}
  return ['—',{name:'Бригада А',email:''},{name:'Бригада Б',email:''},{name:'Бригада В',email:''},{name:'ТОВ Буд-Сервіс',email:''},{name:'Іваненко',email:''},{name:'Петренко',email:''}];
})();

// Збереження — спочатку localStorage, потім Firebase якщо є
const saveRooms = () => {
  try{localStorage.setItem('ht_rooms',JSON.stringify(rooms));}catch(e){}
  if(fbReady && db) {
    db.ref('rooms').set(rooms).catch(e=>console.log('FB save rooms:',e));
  }
};
const saveCons = () => {
  try{localStorage.setItem('ht_cons',JSON.stringify(CONS));}catch(e){}
  if(fbReady && db) {
    db.ref('cons').set(CONS).catch(e=>console.log('FB save cons:',e));
  }
};
const rd = n => { if(!rooms[n]) rooms[n]={s:'n',works:DEFAULT_WORKS.map(mkWork),notes:'',hist:[]}; return rooms[n]; };

let cFloor='all', cSt='all', cTp='all', editing=null, curTab='sum';
let currentUser = null;
let isAdmin = false;

// ═══════════════════════════════════════════════════════════
// RENDER MAIN
// ═══════════════════════════════════════════════════════════
function renderAll() { renderSidebar(); renderStats(); renderFloors(); }

function renderSidebar() {
  const total = allRooms().length;

  // Floors
  const fn = document.getElementById('sbFloors');
  fn.innerHTML = `<button class="fb${cFloor==='all'?' act':''}" data-fid="all">Всі поверхи<span class="fbg">${total}</span></button>`
    + FLOORS.map(f=>`<button class="fb${cFloor===f.id?' act':''}" data-fid="${f.id}">${f.name}<span class="fbg">${f.sections.flatMap(s=>s.rooms).length}</span></button>`).join('');
  fn.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{ cFloor=b.dataset.fid==='all'?'all':parseInt(b.dataset.fid); renderAll(); }));

  // Status
  const sn = document.getElementById('sbStatus');
  const statuses = [['all','Всі','#e2e4ea'],['n',SID.n,SDOT.n],['w',SID.w,SDOT.w],['d',SID.d,SDOT.d],['i',SID.i,SDOT.i]];
  sn.innerHTML = statuses.map(([id,lbl,col])=>`<button class="fb2${cSt===id?' act':''}" data-sid="${id}"><span class="dot8" style="background:${col}"></span>${lbl}</button>`).join('');
  sn.querySelectorAll('.fb2').forEach(b=>b.addEventListener('click',()=>{ cSt=b.dataset.sid; renderAll(); }));

  // Types
  const tn = document.getElementById('sbType');
  tn.innerHTML = `<button class="fb2${cTp==='all'?' act':''}" data-tid="all"><span class="dot8" style="background:var(--mut)"></span>Всі</button>`
    + Object.entries(TM).map(([k,v])=>`<button class="fb2${cTp===k?' act':''}" data-tid="${k}"><span class="dot8" style="background:${v.col}"></span>${v.label}</button>`).join('');
  tn.querySelectorAll('.fb2').forEach(b=>b.addEventListener('click',()=>{ cTp=b.dataset.tid; renderAll(); }));

  // Con nav
  renderConNav();
}

function renderConNav() {
  const stats = buildConStats();
  const active = Object.entries(stats).filter(([,v])=>v.totalW>0);
  const nav = document.getElementById('sbCon');
  if(!active.length){ nav.innerHTML=`<div style="font-size:11px;color:var(--mut);padding:3px 7px">Ще не призначено</div>`; return; }
  nav.innerHTML = active.map(([nm,v])=>
    `<button class="fb2" data-con="${encodeURIComponent(nm)}">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nm}</span>
      <span style="display:flex;gap:3px;align-items:center;flex-shrink:0">
        ${v.issW?`<span style="font-size:10px;color:#f87171;font-weight:600">⚠${v.issW}</span>`:''}
        <span class="fbg">${v.rooms}</span>
      </span>
    </button>`).join('');
  nav.querySelectorAll('.fb2').forEach(b=>b.addEventListener('click',()=>openCPanel(decodeURIComponent(b.dataset.con))));
}

function renderStats() {
  const all=allRooms(), total=all.length, c={n:0,w:0,d:0,i:0};
  all.forEach(n=>c[rd(n).s]++);
  const p=tp(c.d,total);

    <div class="stat"><div class="sn" style="color:var(--acc)">${total}</div><div class="sl">Всього</div></div>

function isVis(n) {
  const q=document.getElementById('srch').value.trim().toLowerCase();

  if(cSt!=='all'&&rd(n).s!==cSt) return false;
  if(cTp!=='all'&&(RT[n]||'std')!==cTp) return false;
  return true;
}

function buildConStats() {
const stats={};
CONS.filter(c=>cName(c)!==’—’).forEach(c=>{ stats[cName(c)]={rooms:0,totalW:0,doneW:0,issW:0}; });
allRooms().forEach(n=>{
rd(n).works.forEach(w=>{
if(!w.con||w.con===’—’) return;
if(!stats[w.con]) stats[w.con]={rooms:0,totalW:0,doneW:0,issW:0};
const s=stats[w.con];
// count rooms once per contractor
s._seen=s._seen||new Set(); if(!s._seen.has(n)){s._seen.add(n);s.rooms++;}
s.totalW++; if(w.ws===‘d’)s.doneW++; if(w.ws===‘i’)s.issW++;
});
});
return stats;
}

function conDetailHTML(nm) {
const byFloor={};
let totalW=0,doneW=0,issW=0,roomCnt=0;
FLOORS.forEach(f=>f.sections.forEach(s=>s.rooms.forEach(n=>{
const ws=rd(n).works.filter(w=>w.con===nm); if(!ws.length) return;
roomCnt++; totalW+=ws.length; doneW+=ws.filter(w=>w.ws===‘d’).length; issW+=ws.filter(w=>w.ws===‘i’).length;
const key=f.id+’|’+s.name;
if(!byFloor[key]) byFloor[key]={floorName:f.name,secName:s.name,rooms:[]};
byFloor[key].rooms.push({n,ws});
})));
if(!roomCnt) return `<div style="color:var(--mut);font-size:12px;padding:16px">Немає призначених робіт</div>`;
const p=tp(doneW,totalW);
let h=`<div class="det-stats"> <span>${roomCnt} кімнат · ${doneW}/${totalW} виконано · ${p}%</span> ${issW?`<span style="color:#f87171;font-weight:600">⚠ ${issW} проблем</span>`:’’}

  </div>
  <div class="det-legend">
    ${Object.entries(WSBG).map(([k,bg])=>`<div class="det-leg-i"><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:${bg};border:1px solid ${WSBD[k]}"></span>${SID[k]}</span></div>`).join('')}
  </div>`;
  Object.values(byFloor).forEach(({floorName,secName,rooms})=>{
    h+=`<div class="det-floor">
      <div class="det-fl-title">${floorName} · ${secName}</div>
      <div class="det-rooms">`;
    rooms.forEach(({n,ws})=>{
      const hasI=ws.some(w=>w.ws==='i'),allD=ws.every(w=>w.ws==='d'),hasW=ws.some(w=>w.ws==='w');
      const st=hasI?'i':allD?'d':hasW?'w':'n';
      h+=`<div class="det-room" data-rid="${n}" style="border-color:${WSBD[st]};background:${WSBG[st]}">
        <div class="det-rnum" style="color:${WSTX[st]}">${rl(n)}</div>
        ${ws.map(w=>`<div class="det-rsub" style="color:${WSTX[w.ws||'n']}">${w.name}</div>`).join('')}
      </div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}

function workDetailHTML(wname) {
const byFloor={};
let total=0,done=0,inW=0,iss=0;
FLOORS.forEach(f=>f.sections.forEach(s=>s.rooms.forEach(n=>{
const w=rd(n).works.find(x=>x.name===wname); if(!w) return;
total++; if(w.ws===‘d’)done++; if(w.ws===‘w’)inW++; if(w.ws===‘i’)iss++;
const key=f.id+’|’+s.name;
if(!byFloor[key]) byFloor[key]={floorName:f.name,secName:s.name,rooms:[]};
byFloor[key].rooms.push({n,w});
})));
if(!total) return `<div style="color:var(--mut);font-size:12px;padding:16px">Ця робота ще не внесена до жодної кімнати</div>`;
const p=tp(done,total);
let h=`<div class="det-stats"> <span>${total} кімнат · ${done} виконано · ${inW} в роботі</span> ${iss?`<span style="color:#f87171;font-weight:600">⚠ ${iss} проблем</span>`:’’}
<div class="pb" style="flex:1;min-width:60px"><div class="pf" style="width:${p}%"></div></div>
<span style="font-family:'IBM Plex Mono',monospace;font-size:11px">${p}%</span>

  </div>
  <div class="det-legend">
    ${Object.entries(WSBG).map(([k,bg])=>`<div class="det-leg-i"><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:${bg};border:1px solid ${WSBD[k]}"></span>${SID[k]}</div>`).join('')}
  </div>`;
  Object.values(byFloor).forEach(({floorName,secName,rooms})=>{
    h+=`<div class="det-floor">
      <div class="det-fl-title">${floorName} · ${secName}</div>
      <div class="det-rooms">`;
    rooms.forEach(({n,w})=>{

    });

  });
  return h;
}

function renderTab(tab) {
curTab=tab;
document.querySelectorAll(’.tab’).forEach(t=>t.classList.toggle(‘act’,t.dataset.tab===tab));
const body=document.getElementById(‘repBody’);
if(tab===‘sum’)  { body.innerHTML=repSum(); return; }
if(tab===‘iss’)  { body.innerHTML=repIss(); return; }
if(tab===‘con’)  { body.innerHTML=rep2col(‘con’); setTimeout(()=>bind2col(’.ri-con’,‘repDetail’,‘conname’,conDetailHTML),10); return; }
if(tab===‘work’) { body.innerHTML=rep2col(‘work’); setTimeout(()=>bind2col(’.ri-work’,‘repDetail’,‘wname’,workDetailHTML),10); return; }
}

function rep2col(type) {
let items=[];
if(type===‘con’) {
const stats=buildConStats();
items=CONS.filter(c=>cName(c)!==’—’).map(c=>{
const nm=cName(c),v=stats[nm]||{rooms:0,totalW:0,doneW:0,issW:0},p=tp(v.doneW,v.totalW);
return `<button class="rep-item ri-con" data-conname="${encodeURIComponent(nm)}"> <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${nm}</span> <span class="rep-item-r">${v.issW?`<span class="ri-iss">⚠${v.issW}</span>`:''}<span class="ri-badge">${v.rooms} кімн. · ${p}%</span></span> </button>`;
});
} else {
const wnames=[…new Set(allRooms().flatMap(n=>rd(n).works.map(w=>w.name)))];
items=wnames.map(wn=>{
let total=0,done=0,iss=0;
allRooms().forEach(n=>{ const w=rd(n).works.find(x=>x.name===wn); if(!w) return; total++; if(w.ws===‘d’)done++; if(w.ws===‘i’)iss++; });
const p=tp(done,total);
return `<button class="rep-item ri-work" data-wname="${encodeURIComponent(wn)}"> <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${wn}</span> <span class="rep-item-r">${iss?`<span class="ri-iss">⚠${iss}</span>`:''}<span class="ri-badge">${done}/${total} · ${p}%</span></span> </button>`;
});
}
return `<div class="rep-2col">
<div class="rep-list">${items.join(’’)}</div>

function repSum() {
const all=allRooms(),total=all.length,c={n:0,w:0,d:0,i:0};
all.forEach(n=>c[rd(n).s]++);
const p=tp(c.d,total);
let h=`<div class="rep-sum-grid"><div class="rc"><h4>Загальна статистика</h4> ${Object.entries(c).map(([k,v])=>`<div class="rr"><span>${SID[k]}</span><strong>${v}</strong></div>`).join('')} <div class="pb" style="margin-top:7px"><div class="pf" style="width:${p}%"></div></div> <div style="font-size:10px;color:var(--mut);margin-top:3px">Прогрес: ${p}%</div></div>`;
FLOORS.forEach(f=>{
const fr=f.sections.flatMap(s=>s.rooms),fc={n:0,w:0,d:0,i:0};
fr.forEach(n=>fc[rd(n).s]++); const fp=tp(fc.d,fr.length);
h+=`<div class="rc"><h4>${f.name}</h4>${Object.entries(fc).filter(([,v])=>v>0).map(([k,v])=>`<div class="rr"><span>${SID[k]}</span><strong>${v}</strong></div>`).join('')}<div class="pb" style="margin-top:6px"><div class="pf" style="width:${fp}%"></div></div><div style="font-size:10px;color:var(--mut);margin-top:2px">${fp}% готово</div></div>`;
});
return h+’</div>’;
}

function repIss() {
const cards=[];
FLOORS.forEach(f=>f.sections.forEach(s=>s.rooms.forEach(n=>{
rd(n).works.forEach(w=>{ if(!(w.issues||[]).length) return; cards.push({n,w,floorName:f.name}); });
})));
if(!cards.length) return `<div style="color:var(--mut);padding:30px;text-align:center;font-size:14px">✓ Проблем не зафіксовано</div>`;
const openCards=cards.filter(x=>x.w.issues.some(e=>e.status===‘open’));
let showOpen=true;
const render=(list)=>list.map(({n,w,floorName})=>` <div class="iss-card"> <div class="iss-hd"> <div><div class="iss-room">${rl(n)}</div><div style="font-size:10px;color:var(--mut)">${floorName}</div></div> <div class="iss-work">${w.name}</div> <div class="iss-con">${w.con||'—'}</div> </div> <div class="iss-log">${w.issues.slice().reverse().map(e=>`
<div class="iss-e">
<div class="iss-ed"><span>${e.date}</span><span class="${e.status==='open'?'ist-o':'ist-c'}">${e.status===‘open’?‘Відкрита’:‘Закрита’}</span>${e.closedDate?`<span style="font-size:9px;color:var(--mut)">закрито ${e.closedDate}</span>`:’’}</div>
<div class="iss-et">${e.text}</div>
</div>`).join('')} </div> </div>`).join(’’);
return `<div style="display:flex;gap:7px;margin-bottom:13px">
<button class="btn pri" id="issFilterO">⚠ Відкриті (${openCards.length})</button>

  <div id="issCards">${render(openCards)}</div>

      this.className='btn pri';document.getElementById('issFilterA').className='btn';
      document.getElementById('issCards').innerHTML=${JSON.stringify(render(openCards))};

    document.getElementById('issFilterA').addEventListener('click',function(){

      document.getElementById('issCards').innerHTML=${JSON.stringify(render(cards))};

  <\/script>`;
}

// CSV

function doCSV() {
let csv=‘Приміщення,Поверх,Секція,Тип,Статус,Вид роботи,Статус роботи,Підрядник,Проблеми\n’;
FLOORS.forEach(f=>f.sections.forEach(sec=>sec.rooms.forEach(n=>{
const r=rd(n);
if(r.works&&r.works.length){
r.works.forEach(w=>{
const iss=(w.issues||[]).map(e=>`[${e.date}][${e.status}] ${e.text}`).join(’ | ‘);
csv+=[rl(n),f.name,sec.name,rtp(n).label,SID[r.s],w.name,WSLBL[w.ws||‘n’],w.con||’’,iss].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(’,’)+’\n’;
});
} else {
csv+=[rl(n),f.name,sec.name,rtp(n).label,SID[r.s],’’,’’,’’,’’].map(v=>`"${v}"`).join(’,’)+’\n’;
}
})));
const a=document.createElement(‘a’);
a.href=‘data:text/csv;charset=utf-8,\uFEFF’+encodeURIComponent(csv);
a.download=`hotel_${new Date().toISOString().slice(0,10)}.csv`;
a.click();
}

// PRINT
// ═══════════════════════════════════════════════════════════
function printRep() {
const old=document.getElementById(‘printArea’); if(old) old.remove();
const div=document.createElement(‘div’);
div.id=‘printArea’;
const date=new Date().toLocaleDateString(‘uk’,{dateStyle:‘long’});
const tabName={sum:‘Загальний звіт’,con:‘По підряднику’,work:‘По видах робіт’,iss:‘Проблеми’}[curTab]||‘Звіт’;
let html=`<h1>ГОТЕЛЬ — ${tabName}</h1><div style="font-size:11px;color:#666;margin-bottom:16px">${date}</div>`;

if(curTab===‘sum’){
const all=allRooms(),total=all.length,c={n:0,w:0,d:0,i:0};
all.forEach(n=>c[rd(n).s]++);
html+=`<table><thead><tr><th>Статус</th><th>Кількість</th><th>%</th></tr></thead><tbody> ${Object.entries(c).map(([k,v])=>`<tr><td>${SID[k]}</td><td>${v}</td><td>${tp(v,total)}%</td></tr>`).join('')} <tr><td><strong>Всього</strong></td><td><strong>${total}</strong></td><td><strong>${tp(c.d,total)}% готово</strong></td></tr> </tbody></table>`;
FLOORS.forEach(f=>{
const fr=f.sections.flatMap(s=>s.rooms),fc={n:0,w:0,d:0,i:0};
fr.forEach(n=>fc[rd(n).s]++);
html+=`<h2>${f.name}</h2><table><thead><tr><th>Статус</th><th>Кількість</th></tr></thead><tbody> ${Object.entries(fc).filter(([,v])=>v>0).map(([k,v])=>`<tr><td>${SID[k]}</td><td>${v}</td></tr>`).join('')} <tr><td><strong>Готовність</strong></td><td><strong>${tp(fc.d,fr.length)}%</strong></td></tr> </tbody></table>`;
});
} else if(curTab===‘con’){
const stats=buildConStats();
CONS.filter(c=>cName(c)!==’—’).forEach(c=>{
const nm=cName(c),rows=[];
FLOORS.forEach(f=>f.sections.forEach(s=>s.rooms.forEach(n=>{
rd(n).works.filter(w=>w.con===nm).forEach(w=>rows.push({n,w,floorName:f.name}));
})));
if(!rows.length) return;
const v=stats[nm]||{};
html+=`<h2>${nm} — ${v.rooms||0} кімнат, ${tp(v.doneW,v.totalW)}% виконано</h2> <table><thead><tr><th>Приміщення</th><th>Поверх</th><th>Вид роботи</th><th>Статус</th></tr></thead><tbody> ${rows.map(({n,w,floorName})=>`<tr><td><strong>${rl(n)}</strong></td><td>${floorName}</td><td>${w.name}</td><td><span class="p-badge p-${w.ws||'n'}">${WSLBL[w.ws||‘n’]}</span></td></tr>`).join('')} </tbody></table>`;
});
} else if(curTab===‘work’){
const wnames=[…new Set(allRooms().flatMap(n=>rd(n).works.map(w=>w.name)))].sort();
wnames.forEach(wname=>{
const rows=[];
FLOORS.forEach(f=>f.sections.forEach(s=>s.rooms.forEach(n=>{
const w=rd(n).works.find(x=>x.name===wname);
if(w) rows.push({n,w,floorName:f.name});
})));
if(!rows.length) return;
const done=rows.filter(r=>r.w.ws===‘d’).length;
html+=`<h2>${wname} — ${done}/${rows.length} (${tp(done,rows.length)}%)</h2> <table><thead><tr><th>Приміщення</th><th>Поверх</th><th>Підрядник</th><th>Статус</th></tr></thead><tbody> ${rows.map(({n,w,floorName})=>`<tr><td><strong>${rl(n)}</strong></td><td>${floorName}</td><td>${w.con||’—’}</td><td><span class="p-badge p-${w.ws||'n'}">${WSLBL[w.ws||‘n’]}</span></td></tr>`).join('')} </tbody></table>`;
});
} else if(curTab===‘iss’){
const cards=[];
FLOORS.forEach(f=>f.sections.forEach(s=>s.rooms.forEach(n=>{
rd(n).works.forEach(w=>{ if((w.issues||[]).length) cards.push({n,w,floorName:f.name}); });
})));
if(!cards.length){ html+=`<p style="color:#666">Проблем не зафіксовано</p>`; }
else {
cards.forEach(({n,w,floorName})=>{
html+=`<div class="p-iss"> <div class="p-iss-hd"><span class="p-iss-room">${rl(n)}</span><span style="color:#666">${floorName}</span><span style="flex:1">${w.name}</span><span style="color:#666">${w.con||'—'}</span></div> ${w.issues.map(e=>`<div class="p-iss-entry"><div class="p-iss-date">${e.date} · ${e.status===‘open’?‘Відкрита’:‘Закрита’}</div><div>${e.text}</div></div>`).join('')} </div>`;
});
}
}

div.innerHTML=html;
document.body.appendChild(div);
window.print();
div.remove();
}

// WORK SUGGESTIONS
// ═══════════════════════════════════════════════════════════
function filterWorkSugg(val) {
const box=document.getElementById(‘workSuggBox’);
if(!box) return;
const names=window._allWorkNames||[];
const q=val.trim().toLowerCase();
const filtered=q?names.filter(n=>n.toLowerCase().includes(q)):names;
const added=editing!==null?(rd(editing).works||[]).map(w=>w.name):[];
const show=filtered.filter(n=>!added.includes(n));
if(!show.length){box.style.display=‘none’;return;}
box.innerHTML=show.map(n=>`<div class="sugg-item" data-val="${n}">${n}</div>`).join(’’);
box.style.display=‘block’;
box.querySelectorAll(’.sugg-item’).forEach(el=>{
const pick=()=>{ document.getElementById(‘newWork’).value=el.dataset.val; box.style.display=‘none’; addWork(); };
el.addEventListener(‘mousedown’,e=>{e.preventDefault();pick();});
el.addEventListener(‘touchend’,e=>{e.preventDefault();pick();});
});
}
document.addEventListener(‘click’,e=>{
const box=document.getElementById(‘workSuggBox’),inp=document.getElementById(‘newWork’);
if(box&&inp&&!box.contains(e.target)&&e.target!==inp) box.style.display=‘none’;
});

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════════════════════════════
firebase.initializeApp(firebaseConfig);
auth = firebase.auth();
db   = firebase.database();

// ADMIN email — ваш Google email
const ADMIN_EMAIL = 'lvivbau2@gmail.com';

document.getElementById('btnGoogleLogin').addEventListener('click', () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope('email');
  provider.addScope('profile');
  auth.signInWithRedirect(provider);
});

  auth.getRedirectResult().then(result => {
  if(result && result.user) console.log('ok');
}).catch(e => console.log(e));

auth.onAuthStateChanged(user => {
  if(!user) { renderAll(); return; }
  
  currentUser = user;
  isAdmin = (user.email === ADMIN_EMAIL);
  document.getElementById('loginScreen').style.display='none';

  // Показуємо хто зайшов
  const userInfo = document.createElement('div');
  userInfo.style.cssText='display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)';
  userInfo.innerHTML=`<img src="${user.photoURL||''}" width="20" height="20" style="border-radius:50%"> ${user.displayName||user.email} ${isAdmin?'<span style="color:var(--acc);font-size:10px">[адмін]</span>':''}
    <button onclick="auth.signOut()" style="background:none;border:none;color:var(--mut);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:3px;border:1px solid var(--brd)">Вийти</button>`;
  document.querySelector('.ml').prepend(userInfo);

  fbReady = true;

  // Завантажуємо дані з Firebase
  db.ref('rooms').once('value').then(snap => {
    const fbRooms = snap.val();
    if(fbRooms) {
      rooms = fbRooms;
      // Додаємо нові кімнати яких може не бути в базі
      allRooms().forEach(n=>{ if(!rooms[n]) rooms[n]={s:'n',works:DEFAULT_WORKS.map(mkWork),notes:'',hist:[]}; });
      try{localStorage.setItem('ht_rooms',JSON.stringify(rooms));}catch(e){}
    }
    db.ref('cons').once('value').then(snap2 => {
      const fbCons = snap2.val();
      if(fbCons && Array.isArray(fbCons)) {
        CONS = fbCons.map(c=>typeof c==='string'&&c!=='—'?{name:c,email:''}:c);
        try{localStorage.setItem('ht_cons',JSON.stringify(CONS));}catch(e){}
      }
      renderAll();

      // Слухаємо зміни в реальному часі
      db.ref('rooms').on('value', snap => {
        const data = snap.val();
        if(data) {
          rooms = data;
          allRooms().forEach(n=>{ if(!rooms[n]) rooms[n]={s:'n',works:DEFAULT_WORKS.map(mkWork),notes:'',hist:[]}; });
          renderAll();
          if(editing!==null) renderWorks();
        }
      });
      db.ref('cons').on('value', snap => {
        const data = snap.val();
        if(data && Array.isArray(data)) {
          CONS = data.map(c=>typeof c==='string'&&c!=='—'?{name:c,email:''}:c);
          renderConNav();
        }
      });
    });
  }).catch(() => {
    // Якщо Firebase недоступний — працюємо локально
    renderAll();
  });
});
</script>

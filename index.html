var FLOORS = [

  {id:2,name:'2 поверх',sections:[{name:'2 секція',rooms:[206,207,208,209,210,211,212,213]},{name:'1 секція',rooms:[214,215,216,217,218,219,220,221,222,223,224,225,226,227]}]},
  {id:3,name:'3 поверх',sections:[{name:'3 секція',rooms:[301,302,303,304,305]},{name:'2 секція',rooms:[306,307,308,309,310,311,312,313]},{name:'1 секція',rooms:[314,315,316,317,318,319,320,321,322,323,324,325,326,327]}]},
  {id:4,name:'4 поверх',sections:[{name:'3 секція',rooms:[401,402,403,404,405]},{name:'2 секція',rooms:[406,407,408,409,410,411,412,413]},{name:'1 секція',rooms:[414,415,416,417,418,419,420,421,422,423,424,425,426,427]}]},
  {id:5,name:'5 поверх',sections:[{name:'2 секція',rooms:[501,502,503,504,505,506,507]},{name:'1 секція',rooms:[508,509,510,511,512,513,514,515,516,517,518,519,520,521]}]},

var TM = {mmg:{label:'ММГ',cls:'t-mmg',col:'#6b7280'},std:{label:'Стандарт',cls:'t-std',col:'#334155'},biz:{label:'Бізнес',cls:'t-biz',col:'#b45309'},imp:{label:'Покращений',cls:'t-imp',col:'#15803d'},semi:{label:'Півлюкс',cls:'t-semi',col:'#7e22ce'},lux:{label:'Люкс',cls:'t-lux',col:'#991b1b'}};

var WSBD = {n:'#2c2d33',w:'#2563eb',d:'#16a34a',i:'#dc2626'};
var WSTX = {n:'#5a5c6a',w:'#60a5fa',d:'#4ade80',i:'#f87171'};
var DW = ['Шпаклівка стін','Фарбування стін і стель','Шпалери','Ковролін'];
var ADMIN = 'lvivbau2@gmail.com';
var FB_CFG = {apiKey:"AIzaSyC9yXNFHumEj54WijGfEDnuc1-1cvPYCfE",authDomain:"zamarstynivska-25.firebaseapp.com",databaseURL:"https://zamarstynivska-25-default-rtdb.europe-west1.firebasedatabase.app",projectId:"zamarstynivska-25",storageBucket:"zamarstynivska-25.firebasestorage.app",messagingSenderId:"1066701061895",appId:"1:1066701061895:web:b0a87dd095308e1c244fa2"};

function allRooms(){return FLOORS.reduce(function(a,f){return a.concat(f.sections.reduce(function(b,s){return b.concat(s.rooms);},[]));},[]);}
function mkWork(n){return {name:n,ws:'n',con:'',issues:[]};}
function mkIssue(t){return {id:Date.now()+Math.random(),date:new Date().toLocaleString('uk',{dateStyle:'short',timeStyle:'short'}),text:t,status:'open'};}
function cName(c){return typeof c==='string'?c:(c.name||'');}
function cEmail(c){return typeof c==='string'?'':(c.email||'');}
function rl(n){return ROOM_NAMES[n]||String(n);}
function rtp(n){return TM[RT[n]||'std'];}
function pct(ws){if(!ws||!ws.length)return 0;return Math.round(ws.filter(function(w){return w.ws==='d';}).length/ws.length*100);}
function tp(d,t){return t?Math.round(d/t*100):0;}
function nowStr(){return new Date().toLocaleString('uk',{dateStyle:'short',timeStyle:'short'});}
function toN(r){return isNaN(r)?r:Number(r);}
function ovOpen(id){document.getElementById(id).classList.add('open');}
function ovClose(id){document.getElementById(id).classList.remove('open');}
function autoS(works){
  if(!works||!works.length)return 'n';
  var ws=works.map(function(w){return w.ws;});
  if(ws.some(function(s){return s==='i';}))return 'i';
  if(ws.every(function(s){return s==='d';}))return 'd';
  if(ws.every(function(s){return s==='n';}))return 'n';
  return 'w';
}

var rooms={}, CONS=['--',{name:'Бригада А',email:''},{name:'Бригада Б',email:''},{name:'Бригада В',email:''},{name:'ТОВ Буд-Сервіс',email:''},{name:'Іваненко',email:''},{name:'Петренко',email:''}];
var cFloor='all', cSt='all', cTp='all', editing=null, curTab='sum';
var db, auth, fbReady=false, currentUser=null, isAdmin=false;

allRooms().forEach(function(n){rooms[n]={s:'n',works:DW.map(mkWork),notes:'',hist:[]};});
function rd(n){if(!rooms[n])rooms[n]={s:'n',works:DW.map(mkWork),notes:'',hist:[]};return rooms[n];}
function saveRooms(){if(fbReady&&db)db.ref('rooms').set(rooms).catch(function(){});}
function saveCons(){if(fbReady&&db)db.ref('cons').set(CONS).catch(function(){});}

// FIREBASE
firebase.initializeApp(FB_CFG);
auth = firebase.auth();
db = firebase.database();

document.getElementById('btnLogin').addEventListener('click', function(){
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var st = document.getElementById('loginStatus');
  if(!email||!pass){st.textContent='Введіть email і пароль';return;}
  st.textContent='Підключення...';
  auth.signInWithEmailAndPassword(email, pass).catch(function(err){
    if(err.code==='auth/user-not-found'||err.code==='auth/wrong-password'||err.code==='auth/invalid-credential'){
      st.textContent='Невірний email або пароль';
    } else {
      st.textContent='Помилка: '+err.message;
    }
  });
});

document.getElementById('loginPass').addEventListener('keydown', function(e){
  if(e.key==='Enter') document.getElementById('btnLogin').click();
});

auth.onAuthStateChanged(function(user){
  if(!user){document.getElementById('loginOv').style.display='flex';return;}
  currentUser = user;
  isAdmin = (user.email===ADMIN);
  document.getElementById('loginOv').style.display='none';
  var bar = document.createElement('div');
  bar.className = 'user-bar';
  bar.innerHTML = user.email+(isAdmin?' [адмін]':'')+' <button class="signout-btn" onclick="firebase.auth().signOut()">Вийти</button>';
  document.getElementById('topRight').prepend(bar);
  fbReady = true;
  db.ref('rooms').once('value').then(function(snap){
    var d = snap.val();
    if(d){
      rooms = d;
      allRooms().forEach(function(n){if(!rooms[n])rooms[n]={s:'n',works:DW.map(mkWork),notes:'',hist:[]};});
    }
    db.ref('cons').once('value').then(function(snap2){
      var c = snap2.val();
      if(c&&Array.isArray(c))CONS=c.map(function(x){return typeof x==='string'&&x!=='--'?{name:x,email:''}:x;});
      renderAll();
      db.ref('rooms').on('value',function(s){var d=s.val();if(d){rooms=d;allRooms().forEach(function(n){if(!rooms[n])rooms[n]={s:'n',works:DW.map(mkWork),notes:'',hist:[]};});renderAll();if(editing!==null)renderWorks();}});
      db.ref('cons').on('value',function(s){var d=s.val();if(d&&Array.isArray(d)){CONS=d.map(function(x){return typeof x==='string'&&x!=='--'?{name:x,email:''}:x;});renderConNav();}});
    });
  }).catch(function(){renderAll();});
});

function renderAll(){renderSidebar();renderStats();renderFloors();}

function renderSidebar(){
  var total=allRooms().length;
  var fn=document.getElementById('sbFloors');
  var fhtml='<button class="fb'+(cFloor==='all'?' act':'')+'" data-fid="all">Всі поверхи<span class="fbg">'+total+'</span></button>';
  FLOORS.forEach(function(f){fhtml+='<button class="fb'+(cFloor===f.id?' act':'')+'" data-fid="'+f.id+'">'+f.name+'<span class="fbg">'+f.sections.reduce(function(a,s){return a+s.rooms.length;},0)+'</span></button>';});
  fn.innerHTML=fhtml;
  fn.querySelectorAll('.fb').forEach(function(b){b.addEventListener('click',function(){cFloor=b.dataset.fid==='all'?'all':parseInt(b.dataset.fid);renderAll();});});
  var sn=document.getElementById('sbStatus');
  var stats=[['all','Всі','#e2e4ea'],['n',SID.n,SDOT.n],['w',SID.w,SDOT.w],['d',SID.d,SDOT.d],['i',SID.i,SDOT.i]];
  sn.innerHTML=stats.map(function(x){return '<button class="fb2'+(cSt===x[0]?' act':'')+'" data-sid="'+x[0]+'"><span class="dot8" style="background:'+x[2]+'"></span>'+x[1]+'</button>';}).join('');
  sn.querySelectorAll('.fb2').forEach(function(b){b.addEventListener('click',function(){cSt=b.dataset.sid;renderAll();});});
  var tn=document.getElementById('sbType');
  var thtml='<button class="fb2'+(cTp==='all'?' act':'')+'" data-tid="all"><span class="dot8" style="background:var(--mut)"></span>Всі</button>';
  Object.keys(TM).forEach(function(k){thtml+='<button class="fb2'+(cTp===k?' act':'')+'" data-tid="'+k+'"><span class="dot8" style="background:'+TM[k].col+'"></span>'+TM[k].label+'</button>';});
  tn.innerHTML=thtml;
  tn.querySelectorAll('.fb2').forEach(function(b){b.addEventListener('click',function(){cTp=b.dataset.tid;renderAll();});});
  renderConNav();
}

function renderConNav(){
  var stats=buildConStats();
  var active=Object.keys(stats).filter(function(nm){return stats[nm].totalW>0;});
  var nav=document.getElementById('sbCon');
  if(!active.length){nav.innerHTML='<div style="font-size:11px;color:var(--mut);padding:3px 7px">Ще не призначено</div>';return;}
  nav.innerHTML=active.map(function(nm){var v=stats[nm];return '<button class="fb2" data-con="'+encodeURIComponent(nm)+'"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+nm+'</span><span class="fbg">'+v.rooms+'</span></button>';}).join('');
  nav.querySelectorAll('.fb2').forEach(function(b){b.addEventListener('click',function(){openCPanel(decodeURIComponent(b.dataset.con));});});
}

function renderStats(){
  var all=allRooms(),total=all.length,c={n:0,w:0,d:0,i:0};
  all.forEach(function(n){c[rd(n).s]++;});
  var p=tp(c.d,total);
  document.getElementById('statsBar').innerHTML='<div class="stat"><div class="sn" style="color:var(--acc)">'+total+'</div><div class="sl">Всього</div></div><div class="stat"><div class="sn" style="color:#22c55e">'+c.d+'</div><div class="sl">Готово</div></div><div class="stat"><div class="sn" style="color:#3b82f6">'+c.w+'</div><div class="sl">В роботі</div></div><div class="stat"><div class="sn" style="color:#ef4444">'+c.i+'</div><div class="sl">Проблеми</div></div><div class="stat pw"><div class="sl">Прогрес -- '+p+'%</div><div class="pb"><div class="pf" style="width:'+p+'%"></div></div></div>';
}

function isVis(n){
  var q=document.getElementById('srch').value.trim().toLowerCase();
  if(q&&String(n).toLowerCase().indexOf(q)<0&&(ROOM_NAMES[n]||'').toLowerCase().indexOf(q)<0)return false;
  if(cSt!=='all'&&rd(n).s!==cSt)return false;
  if(cTp!=='all'&&(RT[n]||'std')!==cTp)return false;
  return true;
}

function roomCell(n){
  var r=rd(n),tpe=rtp(n),p=pct(r.works),named=!!ROOM_NAMES[n];
  return '<div class="room '+tpe.cls+(named?' named':'')+(isVis(n)?'':' hidden')+'" data-s="'+r.s+'" data-rid="'+n+'"><div class="rnum"'+(named?' style="font-size:9px"':'')+'>'+rl(n)+'</div>'+(named?'':'<div class="rtyp">'+tpe.label+'</div>')+'<div class="rpb"><div class="rpbf" style="width:'+p+'%"></div></div></div>';
}

function renderFloors(){
  var floors=cFloor==='all'?FLOORS:FLOORS.filter(function(f){return f.id===cFloor;});
  document.getElementById('floorsWrap').innerHTML=floors.map(function(f){
    var allF=f.sections.reduce(function(a,s){return a.concat(s.rooms);},[]);
    var vis=allF.filter(function(n){return isVis(n);}).length;
    return '<div class="floor-block"><div class="fh">'+f.name+'<span class="fi">'+vis+' з '+allF.length+' прим.</span><button class="btn sm" data-planfid="'+f.id+'">План</button></div>'+f.sections.map(function(s){return '<div class="sec"><div class="secl">'+s.name+'</div><div class="rg">'+s.rooms.map(roomCell).join('')+'</div></div>';}).join('')+'</div>';
  }).join('');
  document.querySelectorAll('.room[data-rid]').forEach(function(el){el.addEventListener('click',function(){openRM(toN(el.dataset.rid));});});
  document.querySelectorAll('[data-planfid]').forEach(function(b){b.addEventListener('click',function(){openPlan(parseInt(b.dataset.planfid));});});
}

function openRM(n){
  editing=n;
  var r=rd(n),tpe=rtp(n);
  var fl=FLOORS.filter(function(f){return f.sections.some(function(s){return s.rooms.indexOf(n)>=0;});})[0];
  var sec=fl?fl.sections.filter(function(s){return s.rooms.indexOf(n)>=0;})[0]:null;
  document.getElementById('mTit').textContent=rl(n);
  document.getElementById('mMeta').innerHTML='<span>'+(fl?fl.name:'')+' . '+(sec?sec.name:'')+'</span><span class="mbadge" style="background:'+tpe.col+'33;color:'+tpe.col+';border:1px solid '+tpe.col+'55">'+tpe.label+'</span><span id="mPct" style="font-family:IBM Plex Mono,monospace;font-size:11px">'+pct(r.works)+'%</span>';
  document.getElementById('roomNotes').value=r.notes||'';
  var h=(r.hist||[]).slice().reverse();
  document.getElementById('hist').innerHTML=h.length?h.map(function(x){return '<div class="hi"><strong>'+x.d+'</strong> -- '+x.t+'</div>';}).join(''):'<div style="font-size:11px;color:var(--mut)">Немає записів</div>';
  window._awn=[];
  var seen={};
  allRooms().forEach(function(rn){rd(rn).works.forEach(function(w){if(!seen[w.name]){seen[w.name]=true;window._awn.push(w.name);}});});
  window._awn.sort();
  renderWorks();
  ovOpen('ovRM');
}

function renderWorks(){
  if(editing===null)return;
  var r=rd(editing);
  var p=pct(r.works);
  document.getElementById('mPf').style.width=p+'%';
  var pe=document.getElementById('mPct');
  if(pe)pe.textContent=p+'%';
  var coHtml=CONS.map(function(c){return '<option value="'+cName(c)+'">'+cName(c)+'</option>';}).join('');
  var html='';
  r.works.forEach(function(w,i){

function filterSugg(val){
  var box=document.getElementById('suggBox'),names=window._awn||[];
  var q=val.trim().toLowerCase();

  var added=editing!==null?rd(editing).works.map(function(w){return w.name;}):[];
  var show=filtered.filter(function(n){return added.indexOf(n)<0;});
  if(!show.length){box.style.display='none';return;}
  box.innerHTML=show.map(function(n){return '<div class="sugg-item" data-val="'+n+'">'+n+'</div>';}).join('');

}

function buildConStats(){
  var stats={};
  CONS.filter(function(c){return cName(c)!=='--';}).forEach(function(c){stats[cName(c)]={rooms:0,totalW:0,doneW:0,issW:0,_s:[]};});
  allRooms().forEach(function(n){
    rd(n).works.forEach(function(w){
      if(!w.con||w.con==='--')return;
      if(!stats[w.con])stats[w.con]={rooms:0,totalW:0,doneW:0,issW:0,_s:[]};
      var s=stats[w.con];
      if(s._s.indexOf(n)<0){s._s.push(n);s.rooms++;}
      s.totalW++;
      if(w.ws==='d')s.doneW++;
      if(w.ws==='i')s.issW++;
    });
  });
  return stats;
}

function conDetailHTML(nm){
  var bf={},tw=0,dw=0,iw=0,rc=0;
  FLOORS.forEach(function(f){f.sections.forEach(function(s){s.rooms.forEach(function(n){
    var ws=rd(n).works.filter(function(w){return w.con===nm;});
    if(!ws.length)return;
    rc++;tw+=ws.length;
    dw+=ws.filter(function(w){return w.ws==='d';}).length;
    iw+=ws.filter(function(w){return w.ws==='i';}).length;
    var k=f.id+'|'+s.name;
    if(!bf[k])bf[k]={fn:f.name,sn:s.name,rooms:[]};
    bf[k].rooms.push({n:n,ws:ws});
  });});});
  if(!rc)return '<div style="color:var(--mut);font-size:12px;padding:16px">Немає призначених робіт</div>';
  var h='<div class="det-stats"><span>'+rc+' кімнат . '+dw+'/'+tw+' виконано . '+tp(dw,tw)+'%</span>'+(iw?'<span style="color:#f87171;font-weight:600">! '+iw+' проблем</span>':'')+'</div>';
  Object.keys(bf).forEach(function(k){
    var v=bf[k];
    h+='<div class="det-floor"><div class="det-fl-title">'+v.fn+' . '+v.sn+'</div><div class="det-rooms">';
    v.rooms.forEach(function(x){
      var hi=x.ws.some(function(w){return w.ws==='i';}),ad=x.ws.every(function(w){return w.ws==='d';}),hw=x.ws.some(function(w){return w.ws==='w';});
      var st=hi?'i':ad?'d':hw?'w':'n';
      h+='<div class="det-room" data-rid="'+x.n+'" style="border-color:'+WSBD[st]+';background:'+WSBG[st]+'"><div class="det-rnum" style="color:'+WSTX[st]+'">'+rl(x.n)+'</div>'+x.ws.map(function(w){return '<div class="det-rsub" style="color:'+WSTX[w.ws||'n']+'">'+w.name+'</div>';}).join('')+'</div>';
    });
    h+='</div></div>';
  });
  return h;
}

function workDetailHTML(wn){
  var bf={},tot=0,don=0,inw=0,iss=0;
  FLOORS.forEach(function(f){f.sections.forEach(function(s){s.rooms.forEach(function(n){
    var w=rd(n).works.filter(function(x){return x.name===wn;})[0];
    if(!w)return;
    tot++;
    if(w.ws==='d')don++;
    if(w.ws==='w')inw++;
    if(w.ws==='i')iss++;
    var k=f.id+'|'+s.name;
    if(!bf[k])bf[k]={fn:f.name,sn:s.name,rooms:[]};
    bf[k].rooms.push({n:n,w:w});
  });});});
  if(!tot)return '<div style="color:var(--mut);font-size:12px;padding:16px">Не призначена жодній кімнаті</div>';
  var p=tp(don,tot);
  var h='<div class="det-stats"><span>'+tot+' кімнат . '+don+' виконано . '+inw+' в роботі</span>'+(iss?'<span style="color:#f87171;font-weight:600">! '+iss+' проблем</span>':'')+'<span style="font-family:monospace;font-size:11px">'+p+'%</span></div>';
  Object.keys(bf).forEach(function(k){
    var v=bf[k];
    h+='<div class="det-floor"><div class="det-fl-title">'+v.fn+' . '+v.sn+'</div><div class="det-rooms">';
    v.rooms.forEach(function(x){
      var st=x.w.ws||'n';
      h+='<div class="det-room" data-rid="'+x.n+'" style="border-color:'+WSBD[st]+';background:'+WSBG[st]+'"><div class="det-rnum" style="color:'+WSTX[st]+'">'+rl(x.n)+'</div>'+(x.w.con?'<div class="det-rsub" style="color:'+WSTX[st]+'">'+x.w.con+'</div>':'')+'</div>';
    });
    h+='</div></div>';
  });
  return h;
}

function bind2col(listSel,detailId,attr,fn){

    btns.forEach(function(b){b.classList.remove('act');});

    var val=decodeURIComponent(btn.dataset[attr]);
    var det=document.getElementById(detailId);
    det.innerHTML=fn(val);
    det.querySelectorAll('[data-rid]').forEach(function(el){el.addEventListener('click',function(){ovClose('ovRep');openRM(toN(el.dataset.rid));});});
  }
  if(btns.length)sel(btns[0]);
  btns.forEach(function(b){b.addEventListener('click',function(){sel(b);});});
}

function renderTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('act',t.dataset.tab===tab);});
  var body=document.getElementById('repBody');
  if(tab==='sum'){body.innerHTML=repSum();return;}
  if(tab==='iss'){body.innerHTML=repIss();return;}
  if(tab==='con'){body.innerHTML=rep2col('con');setTimeout(function(){bind2col('.ri-con','repDetail','conname',conDetailHTML);},10);return;}
  if(tab==='work'){body.innerHTML=rep2col('work');setTimeout(function(){bind2col('.ri-work','repDetail','wname',workDetailHTML);},10);return;}
}

function rep2col(type){
  var items=[];
  if(type==='con'){
    var stats=buildConStats();
    CONS.filter(function(c){return cName(c)!=='--';}).forEach(function(c){
      var nm=cName(c),v=stats[nm]||{rooms:0,totalW:0,doneW:0,issW:0},p=tp(v.doneW,v.totalW);
      items.push('<button class="rep-item ri-con" data-conname="'+encodeURIComponent(nm)+'"><span style="flex:1;overflow:hidden;text-overflow:ellipsis">'+nm+'</span><span class="ri-badge">'+v.rooms+' . '+p+'%</span></button>');
    });
  } else {
    var wnames=[];
    var wseen={};
    allRooms().forEach(function(n){rd(n).works.forEach(function(w){if(!wseen[w.name]){wseen[w.name]=true;wnames.push(w.name);}});});
    wnames.forEach(function(wn){
      var tot=0,don=0,iss=0;
      allRooms().forEach(function(n){var w=rd(n).works.filter(function(x){return x.name===wn;})[0];if(!w)return;tot++;if(w.ws==='d')don++;if(w.ws==='i')iss++;});
      var p=tp(don,tot);
      items.push('<button class="rep-item ri-work" data-wname="'+encodeURIComponent(wn)+'"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+wn+'</span><span class="ri-badge">'+don+'/'+tot+' . '+p+'%</span></button>');
    });
  }
  return '<div class="rep-2col"><div class="rep-list">'+items.join('')+'</div><div class="rep-detail" id="repDetail"><div style="color:var(--mut);font-size:12px">Оберіть зі списку</div></div></div>';
}

function repSum(){
  var all=allRooms(),tot=all.length,c={n:0,w:0,d:0,i:0};
  all.forEach(function(n){c[rd(n).s]++;});
  var p=tp(c.d,tot);
  var h='<div class="rep-sum-grid"><div class="rc"><h4>Загальна статистика</h4>'+Object.keys(c).map(function(k){return '<div class="rr"><span>'+SID[k]+'</span><strong>'+c[k]+'</strong></div>';}).join('')+'<div class="pb" style="margin-top:7px"><div class="pf" style="width:'+p+'%"></div></div><div style="font-size:10px;color:var(--mut);margin-top:3px">Прогрес: '+p+'%</div></div>';
  FLOORS.forEach(function(f){
    var fr=f.sections.reduce(function(a,s){return a.concat(s.rooms);},[]);
    var fc={n:0,w:0,d:0,i:0};
    fr.forEach(function(n){fc[rd(n).s]++;});
    var fp=tp(fc.d,fr.length);
    h+='<div class="rc"><h4>'+f.name+'</h4>'+Object.keys(fc).filter(function(k){return fc[k]>0;}).map(function(k){return '<div class="rr"><span>'+SID[k]+'</span><strong>'+fc[k]+'</strong></div>';}).join('')+'<div class="pb" style="margin-top:6px"><div class="pf" style="width:'+fp+'%"></div></div><div style="font-size:10px;color:var(--mut);margin-top:2px">'+fp+'% готово</div></div>';
  });
  return h+'</div>';
}

function repIss(){
  var cards=[];
  FLOORS.forEach(function(f){f.sections.forEach(function(s){s.rooms.forEach(function(n){rd(n).works.forEach(function(w){if((w.issues||[]).length)cards.push({n:n,w:w,fn:f.name});});});});});
  if(!cards.length)return '<div style="color:var(--mut);padding:30px;text-align:center;font-size:14px">Проблем не зафіксовано</div>';
  var oc=cards.filter(function(x){return x.w.issues.some(function(e){return e.status==='open';});});
  function render(list){
    return list.map(function(x){
      return '<div class="iss-card"><div class="iss-hd"><div><div class="iss-room">'+rl(x.n)+'</div><div style="font-size:10px;color:var(--mut)">'+x.fn+'</div></div><div class="iss-work">'+x.w.name+'</div><div class="iss-con">'+(x.w.con||'--')+'</div></div><div class="iss-log">'+x.w.issues.slice().reverse().map(function(e){return '<div class="iss-e"><div class="iss-ed"><span>'+e.date+'</span><span class="'+(e.status==='open'?'ist-o':'ist-c')+'">'+(e.status==='open'?'Відкрита':'Закрита')+'</span></div><div class="iss-et">'+e.text+'</div></div>';}).join('')+'</div></div>';
    }).join('');
  }
  var html='<div style="display:flex;gap:7px;margin-bottom:13px"><button class="btn pri" id="fOpen">Відкриті ('+oc.length+')</button><button class="btn" id="fAll">Всі ('+cards.length+')</button></div><div id="issCards">'+render(oc)+'</div>';
  setTimeout(function(){
    var fOpen=document.getElementById('fOpen'),fAll=document.getElementById('fAll'),issCards=document.getElementById('issCards');
    if(fOpen){
      fOpen.addEventListener('click',function(){fOpen.className='btn pri';fAll.className='btn';issCards.innerHTML=render(oc);});
      fAll.addEventListener('click',function(){fAll.className='btn pri';fOpen.className='btn';issCards.innerHTML=render(cards);});
    }
  },10);
  return html;
}

  var csv='Приміщення,Поверх,Секція,Тип,Статус,Вид роботи,Статус роботи,Підрядник\n';
  FLOORS.forEach(function(f){f.sections.forEach(function(sec){sec.rooms.forEach(function(n){

    }
  });});});
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
